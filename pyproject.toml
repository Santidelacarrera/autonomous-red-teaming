[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-red-teaming"
version = "0.1.0"
description = "Core graph engine for an autonomous red-teaming and attack graph simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1.0",
    "langgraph>=0.2.60,<1.0",
    "neo4j>=5.24,<6.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/art_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = []
