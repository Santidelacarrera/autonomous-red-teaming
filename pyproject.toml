[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-red-teaming"
version = "0.1.0"
description = "Core graph engine for an autonomous red-teaming and attack graph simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<0.21",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0.10,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
    "neo4j>=5.24,<6.0",
    "pydantic>=2.9,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/art_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = []

[tool.bandit]
# Static security analysis of first-party source only; tests exercise failure
# paths and are excluded to keep signal high.
exclude_dirs = ["tests", ".venv", "frontend"]
