[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autonomous-red-teaming"
version = "0.1.0"
description = "Core graph engine for an autonomous red-teaming and attack graph simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<0.21",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "langgraph>=1.0.10,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
    "neo4j>=5.24,<6.0",
    "pydantic>=2.9,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=9.0,<10.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
# Opt-in concrete production adapters (deployment-owned). Not imported by core code.
redis = [
    "redis>=5.0,<7.0",
]
telemetry = [
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]
postgres = [
    "asyncpg>=0.29,<1.0",
]
dev = [
    "asyncpg>=0.29,<1.0",
    "bandit>=1.8",
    "fakeredis[lua]>=2.26",
    "mypy>=1.13",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "redis>=5.0,<7.0",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/art_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = []

# asyncpg ships no type information; the adapter wraps it behind a typed store.
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.mutmut]
# On-demand mutation testing of the security-critical modules. Run with: `make mutation`
# (slow; not part of the standard CI gate). Each mutant must be killed by the fuzz and
# adversarial suites — surviving mutants reveal weak assertions.
paths_to_mutate = [
    "src/art_sim/infrastructure/cypher_validator.py",
    "src/art_sim/security/sanitizer.py",
    "src/art_sim/security/redaction.py",
    "src/art_sim/security/permissions.py",
]
tests_dir = ["tests/security/", "tests/unit/"]

[tool.bandit]
# Static security analysis of first-party source only; tests exercise failure
# paths and are excluded to keep signal high.
exclude_dirs = ["tests", ".venv", "frontend"]
