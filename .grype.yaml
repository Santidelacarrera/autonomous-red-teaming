# Grype scan policy for the container image.
#
# Policy: fail the build only on High/Critical vulnerabilities that have an available
# upstream fix. Vulnerabilities with no published fix cannot be remediated from this
# repository; they are tracked here and in docs/production-readiness.md rather than
# silently blocking every release. The Dockerfile runs `apt-get upgrade` so that every
# fixable OS CVE is already closed in the built image.
only-fixed: true

# Fail the build at this severity or higher (matches CI's `high` cutoff).
fail-on-severity: high

ignore:
  # CPython CVE-2026-82049: the only published fix is the 3.14.0b1 pre-release. Adopting
  # a beta interpreter on a stable (3.13.x) line would reduce overall reliability and
  # supply-chain assurance more than it mitigates. Revisit when a stable 3.13.x or 3.14.x
  # patch ships. Disposition: accepted with review.
  - vulnerability: CVE-2026-82049
    package:
      name: python
      type: binary
