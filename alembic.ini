[alembic]
script_location = migrations

# The real DSN is never written here: migrations/env.py resolves it from the
# ART_DATABASE_DSN environment variable (populated by scripts/run_migrations.py from the
# configured secret provider) and falls back to ART_PG_TEST_DSN for local/CI runs.
sqlalchemy.url =

file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
