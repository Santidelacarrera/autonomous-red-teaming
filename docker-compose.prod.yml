# Production-like local stack: runs the API in PRODUCTION mode (art_sim.api.serve) wired to
# real PostgreSQL, Redis (broker + rate limiter) and an OTLP collector. The app will report
# NOT READY on /readiness until a real OIDC issuer/JWKS is reachable — that dependency is
# external by design. /health comes up once PostgreSQL and the mounted secrets are present.
#
# Before starting, create the mounted secrets (git-ignored):
#   mkdir -p deploy/secrets
#   openssl rand -hex 32 > deploy/secrets/ART_SIM_APPROVAL_SECRET
#   printf 'postgresql://artsim:artsim@postgres:5432/artsim' > deploy/secrets/ART_DATABASE_DSN
#   printf 'redis://redis:6379/1' > deploy/secrets/ART_BROKER_CREDENTIAL
#
# Then:  docker compose -f docker-compose.prod.yml up --build

services:
  api:
    build:
      context: .
    image: art-sim:local
    command: ["python", "-m", "art_sim.api.serve"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ART_ENV: production
      ART_AUTH_MODE: oidc
      ART_OIDC_ISSUER: "https://identity.example.com"
      ART_OIDC_AUDIENCE: "art-sim"
      ART_OIDC_JWKS_URL: "https://identity.example.com/.well-known/jwks.json"
      ART_CORS_ALLOWED_ORIGINS: "https://command.example.com"
      ART_HSTS_ENABLED: "true"
      ART_RATE_LIMIT_ENABLED: "true"
      ART_MFA_REQUIRED_FOR_SENSITIVE_ACTIONS: "false"
      ART_BROKER_PROVIDER: "redis_streams"
      ART_BROKER_ENDPOINT: "redis://redis:6379"
      ART_BROKER_QUEUE: "art-sim"
      ART_BROKER_CREDENTIAL_SECRET_NAME: "ART_BROKER_CREDENTIAL"
      ART_DATABASE_PROVIDER: "postgresql"
      ART_DATABASE_DSN_SECRET_NAME: "ART_DATABASE_DSN"
      ART_SECRET_PROVIDER: "aws_secrets_manager"
      ART_APPROVAL_SECRET_NAME: "ART_SIM_APPROVAL_SECRET"
      ART_AUDIT_PROVIDER: "siem"
      ART_AUDIT_RETENTION_DAYS: "365"
      ART_TELEMETRY_PROVIDER: "otlp"
      ART_RATE_LIMIT_PROVIDER: "redis"
      ART_SIMULATION_RETENTION_DAYS: "90"
      ART_RESULT_RETENTION_DAYS: "90"
      ART_CHECKPOINT_RETENTION_DAYS: "30"
      ART_DEAD_LETTER_RETENTION_DAYS: "30"
      ART_TELEMETRY_RETENTION_DAYS: "30"
      ART_TLS_TERMINATED_UPSTREAM: "true"
      ART_TRUSTED_PROXY_HOPS: "1"
      ART_SECRETS_DIR: "/run/secrets"
      ART_RATE_LIMIT_ENDPOINT: "redis://redis:6379/0"
      ART_OTLP_ENDPOINT: "http://otel-collector:4318"
      ART_AUDIT_PATH: "/app/var/audit/security.jsonl"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/var:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    volumes:
      - ./deploy/secrets:/run/secrets:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artsim
      POSTGRES_PASSWORD: artsim
      POSTGRES_DB: artsim
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artsim"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  pg-data:
