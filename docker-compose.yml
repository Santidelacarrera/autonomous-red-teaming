# Local development stack. Runs the hardened API container with the development profile
# (header auth, SQLite, in-process worker). Neo4j is optional and only needed for the
# Shadow seed/E2E scripts; start it with:  docker compose --profile shadow up
#
# This compose file is for LOCAL use only. Production composition injects real broker,
# database, secret-manager, OIDC, limiter, audit and telemetry adapters — see docs/deployment.md.

services:
  api:
    build:
      context: .
    image: art-sim:local
    environment:
      ART_ENV: development
      ART_RATE_LIMIT_ENABLED: "true"
      ART_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:5173"
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /app/var:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional Shadow graph for scripts/seed_db.py and scripts/run_e2e.py.
  neo4j:
    profiles: ["shadow"]
    image: neo4j:5.26-community
    environment:
      # Local-only credentials; never reuse in any shared or production environment.
      NEO4J_AUTH: "neo4j/local-shadow-dev-password"
      NEO4J_server_memory_heap_max__size: "512m"
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
