name: disaster-recovery-drill

# Executes the documented docs/disaster-recovery.md backup -> failure -> restore -> verify
# procedure for real, on a schedule, rather than leaving it as an unexecuted written
# procedure. See scripts/backup_restore_drill.sh for what each step actually does.
on:
  schedule:
    - cron: "0 7 * * 1" # weekly, Monday 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install "alembic>=1.13,<2.0" "sqlalchemy[asyncio]>=2.0,<3.0"
      - run: python -m pip install -e . --no-deps
      - name: Run the backup/failure/restore/verify drill
        run: bash scripts/backup_restore_drill.sh
      - name: Record drill outcome
        if: always()
        run: echo "Drill ran at $(date -u +%Y-%m-%dT%H:%M:%SZ); see the step above for PASS/FAIL."
