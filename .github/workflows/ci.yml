name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: artsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ART_PG_TEST_DSN: postgresql://postgres:devpw@127.0.0.1:5432/artsim
      # Real Redis for the broker / rate-limiter / DLQ suites (otherwise they run on fakeredis only).
      ART_REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock pip-audit cyclonedx-bom bandit
      - run: python -m pip install -e . --no-deps
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Dump npm audit report for diagnostics
        # Always capture the full report (not just the high/critical gate below) so a
        # failure is actionable even when a contributor's environment has no path to the
        # npm registry to reproduce it locally. Emits each high/critical finding as a
        # workflow annotation (visible via the Checks API/UI, unlike the raw log or the
        # artifact zip, both served from a host some environments can't reach) in
        # addition to the full JSON artifact.
        if: always()
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "
            const r = JSON.parse(require('fs').readFileSync('npm-audit-report.json', 'utf8'));
            const vulns = r.vulnerabilities || {};
            for (const [name, v] of Object.entries(vulns)) {
              if (v.severity !== 'high' && v.severity !== 'critical') continue;
              const via = (v.via || [])
                .map((x) => (typeof x === 'string' ? x : \`\${x.name}: \${x.title} (\${x.url})\`))
                .join(' | ');
              console.log(\`::warning title=npm audit\\: \${name} (\${v.severity})::range=\${v.range} fixAvailable=\${JSON.stringify(v.fixAvailable)} via=\${via}\`);
            }
          "
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 14
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: python -m ruff check .
      - name: mypy
        run: |
          set -o pipefail
          python -m mypy . 2>&1 | tee mypy-output.txt
        continue-on-error: true
        id: mypy
      - name: Surface mypy errors as annotations and fail if it failed
        if: steps.mypy.outcome == 'failure'
        run: |
          grep -E ': (error|note):' mypy-output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1
      - name: Backend test suite (JUnit results are kept as an artifact)
        run: |
          mkdir -p test-results
          python -m pytest -q -rs --junitxml=test-results/junit.xml
      - name: Test summary (fails if database/Redis tests were silently skipped)
        if: always()
        run: |
          {
            echo "## Backend tests"
            echo
            python scripts/evidence_summary.py junit test-results/junit.xml \
              --fail-on-skip 'No PostgreSQL|ART_REDIS_TEST_URL|unreachable|Docker daemon|cannot pull|could not start|did not (become|open)'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: test-results/junit.xml
          retention-days: 30
      - name: Lab demo (must reproduce the committed findings digest)
        run: python -m art_sim.demo --out evidence/demo --quiet
      - name: Verify the demo's audit hash chain
        run: python scripts/verify_audit_log.py evidence/demo/audit/security.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lab-demo
          path: |
            evidence/demo/report.html
            evidence/demo/report.md
            evidence/demo/findings.json
            evidence/demo/findings.sha256
            evidence/demo/before.svg
            evidence/demo/after.svg
            evidence/demo/REPRODUCIBLE.sha256
            evidence/demo/audit/security.jsonl
            evidence/demo/audit/verification.txt
          retention-days: 30
      - run: python -m bandit -c pyproject.toml -r src
      - run: python -m pip_audit -r requirements.lock
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: cyclonedx-py requirements requirements-runtime.lock --output-reproducible --of JSON -o dist/sbom-python.cdx.json
      - run: npm sbom --sbom-format cyclonedx > ../dist/sbom-frontend.cdx.json
        working-directory: frontend
      - name: Hash release evidence
        shell: bash
        run: python scripts/generate_artifact_manifest.py --output dist/SHA256SUMS dist/*.whl dist/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS

  attest-release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: supply-chain-evidence
          path: dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          # gitleaks-action requires GITHUB_TOKEN to scan pull_request events (it was
          # failing with "GITHUB_TOKEN is now required to scan pull requests" on this PR's
          # own CI run); push events didn't need it, which is why this only showed up here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.ref.outputs.image_ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build non-root runtime image
        run: docker build --tag art-sim:${{ github.sha }} .
      - name: Scan image vulnerabilities
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: art-sim:${{ github.sha }}
          grype-version: v0.119.0
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      - name: Show blocking findings
        if: failure() && steps.scan.outputs.sarif != ''
        run: |
          jq -r '.runs[].results[] | "\(.level)\t\(.ruleId)\t\(.message.text | split("\n")[0])"' \
            "${{ steps.scan.outputs.sarif }}" | sort -u | head -60
      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: art-sim:${{ github.sha }}
          syft-version: v1.52.0
          format: cyclonedx-json
          output-file: container-sbom.cdx.json
      - name: Compute the image reference
        id: ref
        run: echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push'
        # Plain `docker login`, not a third-party action: this repository pins every
        # `uses:` entry to a resolved commit SHA (docs/supply-chain.md), and a login step
        # needs no action at all when the CLI itself can read the token from stdin.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push the scanned image by digest
        id: push
        if: github.event_name == 'push'
        run: |
          docker tag art-sim:${{ github.sha }} ${{ steps.ref.outputs.image_ref }}:${{ github.sha }}
          docker push ${{ steps.ref.outputs.image_ref }}:${{ github.sha }}
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' ${{ steps.ref.outputs.image_ref }}:${{ github.sha }} | cut -d'@' -f2)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  attest-container:
    # Independence (docs/supply-chain.md): this is a SEPARATE job from `container`, with its
    # own minimal permission grant, that attests provenance for the exact digest `container`
    # pushed — it does not re-build the image, so the attestation is bound to the artifact
    # that was actually scanned and pushed, not to a second, possibly-different build.
    if: github.event_name == 'push'
    needs: container
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Log in to GHCR
        # push-to-registry: true below pushes the attestation as an OCI referrer of the
        # image, which needs its own registry credentials in THIS job (attest-container
        # does not inherit the `container` job's login). Plain `docker login`, consistent
        # with the `container` job, for the same pinned-action reason noted there.
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Attest container image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ needs.container.outputs.image_ref }}
          subject-digest: ${{ needs.container.outputs.digest }}
          push-to-registry: true

  verify-container-provenance:
    # Independent verification gate (docs/supply-chain.md): re-derives trust from scratch —
    # a fresh job, downloading nothing from the jobs above, using only the public image
    # reference+digest and the repository identity — to prove the digest a deployment would
    # pull really does carry a valid, repository-scoped build-provenance attestation. This
    # is the check scripts/verify_image_provenance.py also exposes for a deploy pipeline or
    # an operator to run independently of CI, against whatever digest is about to be
    # promoted.
    if: github.event_name == 'push'
    needs: [container, attest-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify provenance independently of the attesting job
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_image_provenance.py \
            "${{ needs.container.outputs.image_ref }}@${{ needs.container.outputs.digest }}" \
            --repo "${{ github.repository }}"
