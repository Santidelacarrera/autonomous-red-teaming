name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock pip-audit cyclonedx-bom bandit
      - run: python -m pip install -e . --no-deps
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: python -m ruff check .
      - run: python -m mypy .
      - run: python -m pytest
      - run: python -m bandit -c pyproject.toml -r src
      - run: python -m pip_audit -r requirements.lock
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: cyclonedx-py requirements requirements-runtime.lock --output-reproducible --of JSON -o dist/sbom-python.cdx.json
      - run: npm sbom --sbom-format cyclonedx > ../dist/sbom-frontend.cdx.json
        working-directory: frontend
      - name: Hash release evidence
        shell: bash
        run: python scripts/generate_artifact_manifest.py --output dist/SHA256SUMS dist/*.whl dist/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-evidence
          path: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS

  attest-release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-evidence
          path: dist
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build non-root runtime image
        run: docker build --tag art-sim:${{ github.sha }} .
      - name: Scan image vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: art-sim:${{ github.sha }}
          grype-version: v0.119.0
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
      - name: Generate container SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: art-sim:${{ github.sha }}
          syft-version: v1.52.0
          format: cyclonedx-json
          output-file: container-sbom.cdx.json
