# Default values for the art-sim hardened API deployment.
# The application runs in PRODUCTION mode, which fails closed without a complete OIDC,
# secret-manager, broker, database, rate-limiter, audit and telemetry configuration.

replicaCount: 2

image:
  repository: ghcr.io/santidelacarrera/art-sim
  tag: ""  # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# Non-secret production configuration (ART_* environment variables).
config:
  ART_ENV: production
  ART_AUTH_MODE: oidc
  ART_HSTS_ENABLED: "true"
  ART_RATE_LIMIT_ENABLED: "true"
  ART_MFA_REQUIRED_FOR_SENSITIVE_ACTIONS: "true"
  ART_CORS_ALLOWED_ORIGINS: "https://command.example.com"
  ART_OIDC_ISSUER: "https://identity.example.com"
  ART_OIDC_AUDIENCE: "art-sim"
  ART_OIDC_JWKS_URL: "https://identity.example.com/.well-known/jwks.json"
  ART_OIDC_MFA_CLAIM: "amr"
  ART_OIDC_MFA_VALUES: "mfa"
  ART_BROKER_PROVIDER: "redis_streams"
  ART_DATABASE_PROVIDER: "postgresql"
  ART_SECRET_PROVIDER: "mounted"
  ART_AUDIT_PROVIDER: "siem"
  ART_TELEMETRY_PROVIDER: "otlp"
  ART_RATE_LIMIT_PROVIDER: "redis"
  ART_RATE_LIMIT_ENDPOINT: "rediss://redis:6379/0"
  ART_OTLP_ENDPOINT: "http://otel-collector:4318"

# Secret names resolved from the mounted secret volume (one file per name).
secrets:
  # Name of an existing Kubernetes Secret projected at /run/secrets.
  mountedSecretName: art-sim-secrets
  mountPath: /run/secrets
  approvalSecretName: ART_SIM_APPROVAL_SECRET
  databaseDsnSecretName: ART_DATABASE_DSN
  brokerCredentialSecretName: ART_BROKER_CREDENTIAL

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Restrict egress to DNS, the database, broker, OIDC/JWKS and the telemetry collector.
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

# Fail-closed security defaults; the container already runs as uid 10001.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
